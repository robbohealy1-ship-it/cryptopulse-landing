<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryptoPulse Public Portfolio</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0f172a; color: #e2e8f0;
  min-height: 100vh;
}
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }

header {
  text-align: center; padding: 40px 0 30px;
  border-bottom: 1px solid #1e293b; margin-bottom: 30px;
}
header h1 { font-size: 32px; color: #38bdf8; margin-bottom: 8px; }
header p { font-size: 15px; color: #94a3b8; }

.brand {
  display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 16px;
}
.brand-icon {
  width: 48px; height: 48px; border-radius: 12px;
  background: linear-gradient(135deg, #38bdf8, #818cf8);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
}

/* Summary Cards */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px; margin-bottom: 30px;
}
.card {
  background: #1e293b; border: 1px solid #334155; border-radius: 12px;
  padding: 24px; text-align: center;
}
.card h3 { font-size: 12px; text-transform: uppercase; color: #94a3b8; margin-bottom: 8px; }
.card .value { font-size: 32px; font-weight: 700; color: #f8fafc; }
.card .change { font-size: 14px; margin-top: 6px; }
.change.up { color: #22c55e; }
.change.down { color: #ef4444; }
.change.neutral { color: #94a3b8; }

/* Trades Table */
.section {
  background: #1e293b; border: 1px solid #334155; border-radius: 12px;
  padding: 24px; margin-bottom: 24px;
}
.section h2 {
  font-size: 18px; color: #38bdf8; margin-bottom: 20px;
  display: flex; align-items: center; gap: 8px;
}

.table-wrap { overflow-x: auto; }
table {
  width: 100%; border-collapse: collapse; font-size: 13px;
}
th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
th { color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 11px; }
tr:hover { background: #0f172a; }

.badge {
  display: inline-block; padding: 3px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 600;
}
.badge.long { background: rgba(34,197,94,0.15); color: #22c55e; }
.badge.short { background: rgba(239,68,68,0.15); color: #ef4444; }
.badge.tp1 { background: rgba(34,197,94,0.15); color: #22c55e; }
.badge.tp2 { background: rgba(34,197,94,0.25); color: #22c55e; }
.badge.tp3 { background: rgba(34,197,94,0.35); color: #22c55e; }
.badge.sl { background: rgba(239,68,68,0.15); color: #ef4444; }

.pnl { font-weight: 600; }
.pnl.up { color: #22c55e; }
.pnl.down { color: #ef4444; }
.pnl.neutral { color: #94a3b8; }

.empty-state {
  text-align: center; padding: 60px 20px; color: #64748b; font-size: 15px;
}
.loading {
  display: inline-block; width: 20px; height: 20px;
  border: 2px solid #334155; border-top-color: #38bdf8;
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.last-updated {
  font-size: 12px; color: #64748b; text-align: right; margin-bottom: 16px;
}

footer {
  text-align: center; padding: 30px 0;
  border-top: 1px solid #1e293b; margin-top: 20px;
  color: #64748b; font-size: 13px;
}
footer a { color: #38bdf8; text-decoration: none; }
footer a:hover { text-decoration: underline; }

.disabled-msg {
  text-align: center; padding: 80px 20px; color: #64748b;
}
.disabled-msg h2 { color: #ef4444; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="container">

<header>
  <div class="brand">
    <div class="brand-icon">📊</div>
    <h1>CryptoPulse Portfolio</h1>
  </div>
  <p>Verified closed trades track record</p>
</header>

<div id="content">
  <div class="empty-state"><div class="loading"></div> Loading portfolio data...</div>
</div>

<footer>
  <p>Powered by <a href="#">CryptoPulse Signals</a> | Data updates every 30 seconds</p>
  <p style="margin-top:8px;font-size:12px;">Past performance does not guarantee future results. Trade responsibly.</p>
</footer>

</div>

<script>
function formatPrice(p) {
  if (!p) return '-';
  return p >= 1 ? '$' + p.toLocaleString('en', {maximumFractionDigits: 4}) : '$' + p.toFixed(6);
}

function formatDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', {day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'});
}

function renderPnl(pnl) {
  if (pnl === null || pnl === undefined) return '<span class="pnl neutral">--</span>';
  const cls = pnl > 0 ? 'up' : pnl < 0 ? 'down' : 'neutral';
  const emoji = pnl > 0 ? '+' : '';
  return `<span class="pnl ${cls}">${emoji}${pnl.toFixed(2)}%</span>`;
}

function getStatusBadge(tp1, tp2, tp3) {
  if (tp3) return '<span class="badge tp3">TP3 HIT</span>';
  if (tp2) return '<span class="badge tp2">TP2 HIT</span>';
  if (tp1) return '<span class="badge tp1">TP1 HIT</span>';
  return '<span class="badge sl">SL HIT</span>';
}

async function loadPortfolio() {
  const content = document.getElementById('content');
  
  try {
    const res = await fetch('/api/public/portfolio');
    const data = await res.json();
    
    if (!data.enabled) {
      content.innerHTML = `
        <div class="disabled-msg">
          <h2>🔒 Portfolio Not Public</h2>
          <p>The public portfolio page is currently disabled.</p>
        </div>`;
      return;
    }
    
    if (data.error) {
      content.innerHTML = `<div class="empty-state">Error: ${data.error}</div>`;
      return;
    }
    
    const signals = data.signals || [];
    const total = data.count || 0;
    const wins = data.wins || 0;
    const losses = data.losses || 0;
    const winRate = data.win_rate || 0;
    const totalPnl = data.total_pnl || 0;
    
    // Build summary cards
    const summaryHtml = `
      <div class="grid">
        <div class="card">
          <h3>Closed Trades</h3>
          <div class="value">${total}</div>
          <div class="change neutral">Total verified</div>
        </div>
        <div class="card">
          <h3>Win Rate</h3>
          <div class="value">${winRate}%</div>
          <div class="change ${winRate >= 50 ? 'up' : 'down'}">${wins}W / ${losses}L</div>
        </div>
        <div class="card">
          <h3>Total P&L</h3>
          <div class="value">${totalPnl > 0 ? '+' : ''}${totalPnl.toFixed(1)}%</div>
          <div class="change ${totalPnl >= 0 ? 'up' : 'down'}">Combined returns</div>
        </div>
        <div class="card">
          <h3>Avg per Trade</h3>
          <div class="value">${total > 0 ? (totalPnl / total).toFixed(2) : '--'}%</div>
          <div class="change neutral">Mean return</div>
        </div>
      </div>
    `;
    
    // Build trades table
    let tableHtml = '';
    if (signals.length === 0) {
      tableHtml = '<div class="empty-state">No closed trades yet. Check back soon!</div>';
    } else {
      tableHtml = `
        <div class="section">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h2>📋 Closed Trades</h2>
            <div class="last-updated">Updated: ${new Date().toLocaleTimeString()}</div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Symbol</th>
                  <th>Dir</th>
                  <th>Result</th>
                  <th>Entry</th>
                  <th>Exit</th>
                  <th>P&L %</th>
                  <th>R/R</th>
                  <th>Closed</th>
                </tr>
              </thead>
              <tbody>
                ${signals.map(t => `
                  <tr>
                    <td><strong>${t.symbol}</strong> <span style="color:#64748b;font-size:11px;">${t.timeframe}</span></td>
                    <td><span class="badge ${t.direction.toLowerCase()}">${t.direction}</span></td>
                    <td>${getStatusBadge(t.tp1_hit, t.tp2_hit, t.tp3_hit)}</td>
                    <td>${formatPrice(t.entry_price)}</td>
                    <td>${formatPrice(t.actual_exit)}</td>
                    <td>${renderPnl(t.pnl_percent)}</td>
                    <td>1:${t.risk_reward?.toFixed(2) || '--'}</td>
                    <td>${formatDate(t.closed_at)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }
    
    content.innerHTML = summaryHtml + tableHtml;
    
  } catch (e) {
    content.innerHTML = `<div class="empty-state">Failed to load portfolio data. Please try again later.</div>`;
  }
}

// Load initially and refresh every 30 seconds
loadPortfolio();
setInterval(loadPortfolio, 30000);
</script>
</body>
</html>
