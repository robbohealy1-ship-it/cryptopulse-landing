<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CryptoPulse - Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e2e8f0;
    }
    .login-box {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 40px 32px;
      width: 90%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .login-box h1 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #f8fafc;
    }
    .login-box p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .login-box input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(15, 23, 42, 0.6);
      color: #f8fafc;
      font-size: 15px;
      outline: none;
    }
    .login-box input::placeholder { color: #64748b; }
    .login-box input:focus { border-color: #22c55e; }
    .login-box button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #22c55e;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    .login-box button:active { transform: scale(0.98); }
    .error {
      color: #ef4444;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }
    .logo {
      font-size: 36px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">🚀</div>
    <h1>CryptoPulse</h1>
    <p>Admin Dashboard</p>
    <div class="error" id="err">Invalid credentials</div>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" autocomplete="username" required>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Sign In</button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      if (r.ok) {
        window.location.href = '/';
      } else {
        document.getElementById('err').style.display = 'block';
      }
    });
  </script>
</body>
</html>
